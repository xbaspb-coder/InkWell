<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Insider</title>
<style>
  :root{--bg:#10131c;--bg2:#171b27;--bg3:#1f2433;--fg:#ece6d6;--fg2:#9aa0b1;--line:rgba(255,255,255,.09);--acc:#e8b04a;--good:#5cc98a;--warn:#e8b04a;--bad:#ff6b5e;--track:rgba(255,255,255,.08);color-scheme:dark}
  :root.light{--bg:#f4efe2;--bg2:#fbf7ec;--bg3:#ece4cf;--fg:#2b2418;--fg2:#6d6247;--line:rgba(60,45,10,.14);--good:#25965a;--warn:#b7791f;--bad:#c9372c;--track:rgba(60,45,10,.1);color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;-webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
  .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#2fb6a5,#1d6f86);color:#fff;font-size:20px;flex:none}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.01em}
  .sub{color:var(--fg2);font-size:12.5px}
  .live{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:12px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(92,201,138,.18)}
  .dot.off{background:var(--fg2);box-shadow:none}
  nav{display:flex;gap:4px;padding:4px 14px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
  nav::-webkit-scrollbar{display:none}
  nav button{appearance:none;border:0;background:transparent;color:var(--fg2);font:inherit;font-weight:550;padding:7px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
  nav button[aria-selected=true]{background:var(--bg3);color:var(--fg)}
  nav button:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  main{flex:1;overflow:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .tile{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;min-width:0}
  .tile .k{color:var(--fg2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
  .tile .v{font-size:26px;font-weight:650;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .tile .s{color:var(--fg2);font-size:12.5px;min-height:18px}
  canvas.spark{width:100%;height:46px;display:block;margin-top:8px}
  .bar{height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;border-radius:5px;background:var(--acc);transition:width .4s}
  h2{font-size:15px;margin:22px 0 10px;font-weight:650}
  h2:first-child{margin-top:2px}
  .note{color:var(--fg2);font-size:12.5px;margin:10px 0 0}
  .batt{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .ring{width:118px;height:118px;flex:none}
  .ring text{font-weight:650;fill:var(--fg)}
  .big{font-size:22px;font-weight:650}
  .seg{display:inline-flex;background:var(--bg3);border-radius:10px;padding:3px;gap:2px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--fg2);font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--bg);color:var(--fg)}
  .list{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .app{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:center;padding:9px 10px;border-radius:11px}
  .app:nth-child(odd){background:var(--bg2)}
  .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--bg3);font-size:17px;grid-row:span 2}
  .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--fg2);font-size:12px;grid-column:2/4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  .app .bar{grid-column:2/4;margin-top:2px;height:6px}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{color:var(--fg2);font-weight:550;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl td.n{white-space:normal}
  .tbl th.r,.tbl td.r{text-align:right}
  .tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg3)}
  .tag.low{color:var(--good)}.tag.mid{color:var(--warn)}.tag.high{color:var(--bad)}
  .scroll{overflow-x:auto}
  dl{display:grid;grid-template-columns:minmax(120px,38%) 1fr;margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  dt,dd{margin:0;padding:9px 14px;border-bottom:1px solid var(--line)}
  dt{color:var(--fg2)}
  dd{font-variant-numeric:tabular-nums;word-break:break-word}
  dl > :nth-last-child(-n+2){border-bottom:0}
  .msg{max-width:440px;margin:40px auto;text-align:center;color:var(--fg2)}
  .msg .big{color:var(--fg);display:block;margin:10px 0 6px;font-size:18px}
  .btn{appearance:none;border:0;background:var(--acc);color:#1a1306;font:inherit;font-weight:650;padding:9px 18px;border-radius:10px;cursor:pointer;margin-top:14px}
  .sel{font:inherit;font-size:13px;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  @media (max-width:520px){header{padding:12px 14px 6px}main{padding:12px 12px 20px}.tile .v{font-size:23px}.hide-s{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">◉</div>
  <div><h1>Insider</h1><div class="sub" id="who">Looking at this device…</div></div>
  <div class="live" aria-live="polite"><span class="dot off" id="dot"></span><span id="liveTxt">Starting</span></div>
</header>
<nav role="tablist" aria-label="Insider pages" id="tabs"></nav>
<main id="main"></main>
<script>
'use strict';
/* Insider — the status of Quill.OS and the device it runs on.
   Inside Quill.OS (installed from XApps) it asks Quill, which measures every app's work.
   Opened on its own, it shows what the browser itself can tell. */
const $ = s => document.querySelector(s);
const el = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.setAttribute('style', v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const fmtBytes = n => { if (n == null || !isFinite(n)) return '—'; if (n < 1024) return Math.round(n) + ' B'; if (n < 1048576) return (n / 1024).toFixed(0) + ' KB'; if (n < 1073741824) return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB'; return (n / 1073741824).toFixed(1) + ' GB'; };
const fmtDur = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); if (h) return h + ' h ' + m + ' min'; if (m) return m + ' min'; return s + ' s'; };
const pct = (v, d) => v == null || !isFinite(v) ? '—' : v > 0 && v < (d === 0 ? 1 : 0.1) ? '<' + (d === 0 ? '1' : '0.1') + '%' : (v < 10 && d !== 0 ? v.toFixed(d == null ? 1 : d) : Math.round(v)) + '%';
const fmtWork = ms => ms < 1000 ? Math.round(ms) + ' ms' : ms < 60000 ? (ms / 1000).toFixed(1) + ' s' : fmtDur(ms);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

/* ---------- where the numbers come from ---------- */
const inQuill = window.parent !== window;
let mode = inQuill ? 'waiting' : 'alone';   // waiting | quill | asking | denied | alone
let pending = false, data = null, lastReply = 0, tab = 'overview', battView = 'total', appSort = 'energy';
const cpuHist = [], memHist = [];
function ask(again) { try { parent.postMessage({ insider: 1, type: 'status', ask: !!again }, '*'); } catch (e) { } }
window.addEventListener('message', e => {
  if (e.source !== parent) return;
  const m = e.data;
  if (!m || m.insider !== 1) return;
  lastReply = Date.now();
  if (m.type === 'status' && m.data) { mode = 'quill'; take(m.data); }
  else if (m.type === 'asking') { if (mode !== 'quill') { mode = 'asking'; draw(); } }
  else if (m.type === 'denied') { mode = 'denied'; draw(); }
});

/* On its own: the same kind of answer, from what this browser shares. */
let ownBattery = null, ownBatteryWhy = 'Checking the battery…', ownStorage = null;
function deviceInfo() {
  const ua = navigator.userAgent, tp = navigator.maxTouchPoints || 0; let kind = 'Computer', os = '', browser = 'Web browser', m;
  if (/iPhone/.test(ua)) kind = 'iPhone'; else if (/iPad/.test(ua) || (/Macintosh/.test(ua) && tp > 1)) kind = 'iPad'; else if (/Macintosh|Mac OS X/.test(ua)) kind = 'Mac';
  else if (/Android/.test(ua)) kind = /Mobile/.test(ua) ? 'Android phone' : 'Android tablet'; else if (/Windows/.test(ua)) kind = 'Windows PC'; else if (/Linux/.test(ua)) kind = 'Linux computer';
  if ((m = ua.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))? like Mac OS X/))) os = (kind === 'iPad' ? 'iPadOS ' : 'iOS ') + m[1] + '.' + m[2] + (m[3] ? '.' + m[3] : '');
  else if (kind === 'iPad') os = 'iPadOS';
  else if ((m = ua.match(/Mac OS X (\d+)[_.](\d+)/))) os = m[1] === '10' && m[2] === '15' ? 'macOS (the browser hides the exact version)' : 'macOS ' + m[1] + '.' + m[2];
  else if ((m = ua.match(/Android ([\d.]+)/))) os = 'Android ' + m[1]; else if (/Windows/.test(ua)) os = 'Windows'; else if (/Linux/.test(ua)) os = 'Linux';
  if ((m = ua.match(/Edg(?:A|iOS)?\/(\d+)/))) browser = 'Edge ' + m[1]; else if ((m = ua.match(/CriOS\/(\d+)/))) browser = 'Chrome ' + m[1] + ' (uses Safari’s engine)';
  else if ((m = ua.match(/FxiOS\/(\d+)/))) browser = 'Firefox ' + m[1] + ' (uses Safari’s engine)'; else if ((m = ua.match(/Firefox\/(\d+)/))) browser = 'Firefox ' + m[1];
  else if ((m = ua.match(/Chrome\/(\d+)/))) browser = 'Chrome ' + m[1]; else if ((m = ua.match(/Version\/([\d.]+).*Safari/))) browser = 'Safari ' + m[1];
  const c = navigator.connection || null, mq = q => !!(window.matchMedia && matchMedia(q).matches);
  return { kind, os, browser, cores: navigator.hardwareConcurrency || null, deviceMemory: navigator.deviceMemory || null,
    screen: { w: screen.width, h: screen.height, dpr: devicePixelRatio || 1, depth: screen.colorDepth || null }, viewport: { w: innerWidth, h: innerHeight },
    orientation: (screen.orientation && screen.orientation.type) || (innerWidth >= innerHeight ? 'landscape' : 'portrait'), touch: tp,
    language: navigator.language || '', timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || '', online: navigator.onLine,
    connection: c ? { type: c.effectiveType || c.type || '', downlink: c.downlink == null ? null : c.downlink, rtt: c.rtt == null ? null : c.rtt, saveData: !!c.saveData } : null,
    dark: mq('(prefers-color-scheme: dark)'), reducedMotion: mq('(prefers-reduced-motion: reduce)'), standalone: mq('(display-mode: standalone)') || navigator.standalone === true, visible: document.visibilityState === 'visible' };
}
let frames = 0, fpsT = performance.now(), fps = 0;
function ownSnapshot() {
  const t = performance.now(); if (t - fpsT > 900) { fps = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t; }
  const b = ownBattery, pm = performance.memory, dev = deviceInfo();
  const fin = v => (isFinite(v) && v > 0 ? v : null);
  return { v: 1, time: Date.now(), look: { dark: dev.dark }, quill: null,
    cpu: { cores: dev.cores, quillNow: null, lag: null, fps },
    memory: pm ? { source: 'browser', used: pm.usedJSHeapSize, limit: pm.jsHeapSizeLimit } : { source: 'none', used: null, limit: null },
    storage: ownStorage, battery: b ? { supported: true, level: b.level, charging: b.charging, chargingTime: fin(b.chargingTime), dischargingTime: fin(b.dischargingTime), drainPerHour: null } : { supported: false, why: ownBatteryWhy },
    device: dev, apps: null };
}

function take(d) {
  data = d;
  if (d.cpu && d.cpu.quillNow != null) { cpuHist.push(d.cpu.quillNow); if (cpuHist.length > 60) cpuHist.shift(); }
  if (d.memory && d.memory.used != null) { memHist.push(d.memory.used); if (memHist.length > 60) memHist.shift(); }
  const a = document.activeElement;
  if (a && a.tagName === 'SELECT') { pending = true; return; }   // do not close an open drop-down
  document.documentElement.classList.toggle('light', d.look && d.look.dark === false);
  if (d.look && /^#[0-9a-f]{6}$/i.test(d.look.accent || '')) document.documentElement.style.setProperty('--acc', d.look.accent);
  draw();
}
function refresh() { if (mode === 'alone') take(ownSnapshot()); }
function tick() {
  if (mode === 'alone') refresh();
  else {
    ask(false);
    // No answer for 3 seconds: this is not Quill.OS (or an old one); show what the browser can tell.
    if (!lastReply && performance.now() > 3000) { mode = 'alone'; ownInit(); refresh(); }
  }
  const live = mode === 'quill' || mode === 'alone';
  $('#dot').className = 'dot' + (live && document.visibilityState === 'visible' ? '' : ' off');
  $('#liveTxt').textContent = mode === 'quill' ? 'Live from Quill.OS' : mode === 'alone' ? 'This browser only' : mode === 'denied' ? 'No access' : 'Connecting';
}
function ownInit() {
  if (ownInit.done) return; ownInit.done = true;
  if (typeof navigator.getBattery === 'function') navigator.getBattery().then(b => { ownBattery = b; b.addEventListener('levelchange', refresh); b.addEventListener('chargingchange', refresh); refresh(); }, () => { ownBatteryWhy = 'This browser did not share the battery.'; });
  else ownBatteryWhy = 'This browser does not tell web pages about the battery (Safari never does). Try Chrome or Edge on a Mac.';
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(s => { ownStorage = { usage: s.usage, quota: s.quota }; }, () => { });
  const f = () => { frames++; requestAnimationFrame(f); }; requestAnimationFrame(f);
}

/* ---------- drawing ---------- */
const TABS = [['overview', 'Overview'], ['battery', 'Battery'], ['apps', 'Apps'], ['device', 'Device']];
function drawTabs() {
  const n = $('#tabs'); n.textContent = '';
  for (const [id, label] of TABS) n.append(el('button', { role: 'tab', type: 'button', 'data-k': 'tab-' + id, 'aria-selected': String(tab === id), text: label, onclick: () => { tab = id; draw(); $('#main').scrollTop = 0; } }));
}
function spark(values, max, color) {
  const cv = el('canvas', { class: 'spark', 'aria-hidden': 'true' });
  requestAnimationFrame(() => {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; if (!r.width) return;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    const W = r.width, H = r.height; if (values.length < 2) return;
    const top = Math.max(max || 0, ...values) || 1;
    c.beginPath(); values.forEach((v, i) => { const x = W - (values.length - 1 - i) * (W / 59), y = H - 2 - (v / top) * (H - 6); i ? c.lineTo(x, y) : c.moveTo(x, y); });
    c.strokeStyle = color; c.lineWidth = 1.8; c.lineJoin = 'round'; c.stroke();
    c.lineTo(W, H); c.lineTo(W - (values.length - 1) * (W / 59), H); c.closePath(); c.globalAlpha = .14; c.fillStyle = color; c.fill();
  });
  return cv;
}
const accent = () => getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#e8b04a';
const bar = (p, color) => el('div', { class: 'bar' }, el('i', { style: 'width:' + Math.max(0, Math.min(100, p || 0)).toFixed(1) + '%' + (color ? ';background:' + color : '') }));
function battLevelColor(l, charging) { return charging ? 'var(--good)' : l <= .1 ? 'var(--bad)' : l <= .2 ? 'var(--warn)' : 'var(--good)'; }
function battState(b) { return b.charging ? (b.level >= 1 ? 'Charged' : 'Charging') : 'On battery'; }
function battDetail(b) { return b.charging ? (b.level < 1 && b.chargingTime ? 'Full in ' + fmtDur(b.chargingTime * 1000) : '') : (b.dischargingTime ? 'About ' + fmtDur(b.dischargingTime * 1000) + ' left' : ''); }
function battLine(b) {
  if (!b || !b.supported) return '';
  if (b.charging) return b.level >= 1 ? 'Charged' : 'Charging' + (b.chargingTime ? ' · full in ' + fmtDur(b.chargingTime * 1000) : '');
  return 'On battery' + (b.dischargingTime ? ' · about ' + fmtDur(b.dischargingTime * 1000) + ' left' : '');
}
function impact(r) { const v = r.energyNow || 0; return v < 2 ? ['Low', 'low'] : v < 10 ? ['Moderate', 'mid'] : ['High', 'high']; }
const STATES = { front: 'in front', open: 'open', 'other chapter': 'in another chapter', minimised: 'minimised', closed: 'closed', running: 'running' };
function stateText(r) { return r.id === 'sys' ? 'always running' : (STATES[r.state] || r.state) + (r.windows > 1 ? ' · ' + r.windows + ' windows' : ''); }

function message(icon, title, text, button) {
  return el('div', { class: 'msg' }, el('div', { style: 'font-size:34px', text: icon }), el('span', { class: 'big', text: title }), el('div', { text }), button || null);
}

function draw() {
  const f = document.activeElement, fk = f && f.dataset ? f.dataset.k : null;
  drawTabs();
  const main = $('#main'), keep = main.scrollTop; main.textContent = '';
  try { drawPage(main); } finally { main.scrollTop = keep; if (fk) { const g = document.querySelector('[data-k="' + fk + '"]'); if (g) g.focus({ preventScroll: true }); } }
}
function drawPage(main) {
  if (data && data.device) $('#who').textContent = [data.device.kind, data.device.browser].filter(Boolean).join(' · ') + (data.quill ? ' · Quill.OS' : '');
  if (mode === 'waiting') { main.append(message('◌', 'Connecting to Quill.OS…', 'One moment.')); return; }
  if (mode === 'asking') { main.append(message('🔐', 'Waiting for your answer', 'Quill.OS is asking whether Insider may see how it is doing. Answer in the box that opened in Quill.OS.')); return; }
  if (mode === 'denied') { main.append(message('🚫', 'Quill.OS did not allow Insider', 'Insider needs your permission to see the processor, memory, battery and open apps. It never sees your files.', el('button', { class: 'btn', type: 'button', text: 'Ask again', onclick: () => { ask(true); } }))); return; }
  if (!data) return;
  ({ overview, battery, apps, device })[tab](main, data);
}

function overview(main, d) {
  const g = el('div', { class: 'grid' });
  const c = d.cpu || {};
  g.append(el('section', { class: 'tile' }, el('div', { class: 'k' }, el('span', { text: 'Processor' }), el('span', { text: c.cores ? c.cores + ' cores' : '' })),
    el('div', { class: 'v', text: c.quillNow == null ? (d.quill ? '…' : '—') : pct(c.quillNow) }),
    el('div', { class: 's', text: d.quill ? 'Quill.OS’s apps, of one core' + (c.lag != null ? ' · delay ' + c.lag + ' ms' : '') : 'Only Quill.OS can measure this' }),
    d.quill ? spark(cpuHist, 10, accent()) : null));
  const m = d.memory || {};
  g.append(el('section', { class: 'tile' }, el('div', { class: 'k' }, el('span', { text: 'Memory' }), el('span', { text: d.device && d.device.deviceMemory ? '≥ ' + d.device.deviceMemory + ' GB in device' : '' })),
    el('div', { class: 'v', text: fmtBytes(m.used) }),
    el('div', { class: 's', text: m.source === 'browser' ? 'Used by this page' + (m.limit ? ' · limit ' + fmtBytes(m.limit) : '') : m.source === 'estimate' ? 'Estimated from the open apps (the browser hides the real figure)' : 'This browser hides memory use' }),
    m.used != null ? spark(memHist, 0, '#5aa7ff') : null));
  const q = d.quill, st = d.storage;
  g.append(el('section', { class: 'tile' }, el('div', { class: 'k' }, el('span', { text: 'Storage' })),
    el('div', { class: 'v', text: q ? pct(q.storage.used / q.storage.limit * 100, 0) : st ? fmtBytes(st.usage) : '—' }),
    el('div', { class: 's', text: q ? fmtBytes(q.storage.used) + ' of ' + fmtBytes(q.storage.limit) + ' for Quill’s files' : st ? 'used by this site, of ' + fmtBytes(st.quota) + ' allowed' : 'Not shared by this browser' }),
    q ? bar(q.storage.used / q.storage.limit * 100) : st && st.quota ? bar(st.usage / st.quota * 100) : null,
    q && st ? el('div', { class: 's', style: 'margin-top:8px', text: 'Browser storage: ' + fmtBytes(st.usage) + ' of ' + fmtBytes(st.quota) }) : null));
  const b = d.battery || {};
  g.append(el('section', { class: 'tile' }, el('div', { class: 'k' }, el('span', { text: 'Battery' })),
    el('div', { class: 'v', text: b.supported ? Math.round(b.level * 100) + '%' : '—' }),
    el('div', { class: 's', text: b.supported ? battLine(b) : 'Not shared by this browser' }),
    b.supported ? bar(b.level * 100, battLevelColor(b.level, b.charging)) : null));
  main.append(g);
  if (d.apps && d.apps.length) {
    main.append(el('h2', { text: 'Using the most battery right now' }));
    const top = d.apps.filter(r => r.energyNow > 0).sort((a, b) => b.energyNow - a.energyNow).slice(0, 4);
    main.append(appList(top.length ? top : d.apps.slice(0, 4), 'now'));
    main.append(el('div', { class: 'row', style: 'margin-top:12px;color:var(--fg2);font-size:12.5px' },
      el('span', { text: (q ? q.windows + ' windows open · Quill.OS running for ' + fmtDur(q.uptime) : '') }),
      el('span', { text: c.fps ? c.fps + ' frames per second' : '' })));
  } else if (!d.quill) main.append(el('p', { class: 'note', text: 'Install Insider from XApps inside Quill.OS to see the processor use and battery use of every app.' }));
}

function appList(rows, which) {
  const list = el('div', { class: 'list' });
  const max = Math.max(...rows.map(r => which === 'now' ? r.shareNow : r.share), 1);
  for (const r of rows) {
    const share = which === 'now' ? r.shareNow : r.share;
    const bits = [stateText(r)];
    if (r.playing) bits.push('playing sound');
    if (r.sealed) bits.push('XApp (its inside cannot be measured)');
    list.append(el('div', { class: 'app' }, el('div', { class: 'ico', text: r.icon || '•' }),
      el('div', { class: 'nm', text: r.name }), el('div', { class: 'pc', text: pct(share) }),
      el('div', { class: 'meta', text: bits.join(' · ') }),
      bar(share / max * 100)));
  }
  return list;
}

function battery(main, d) {
  const b = d.battery || {};
  if (b.supported) {
    const l = Math.max(0, Math.min(1, b.level)), C = 2 * Math.PI * 50;
    const svg = '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Battery ' + Math.round(l * 100) + '%"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--track)" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="' + battLevelColor(l, b.charging) + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (C * l).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" font-size="24">' + Math.round(l * 100) + '%</text></svg>';
    const ring = el('div'); ring.innerHTML = svg;
    main.append(el('div', { class: 'batt' }, ring.firstChild, el('div', {}, el('div', { class: 'big', text: (b.charging ? '⚡ ' : '🔋 ') + battState(b) }),
      battDetail(b) ? el('div', { class: 'sub', text: battDetail(b) }) : null,
      b.drainPerHour ? el('div', { class: 'sub', text: 'Going down about ' + b.drainPerHour.toFixed(1) + '% per hour since it was unplugged' }) : null)));
  } else main.append(el('div', { class: 'tile' }, el('div', { class: 'k', text: 'Battery' }), el('div', { class: 's', style: 'margin-top:6px', text: b.why || 'Not shared by this browser.' })));
  if (!d.apps) { main.append(el('p', { class: 'note', text: 'Which apps use the battery is only known inside Quill.OS: install Insider from XApps there.' })); return; }
  main.append(el('div', { class: 'row', style: 'margin-top:22px' }, el('h2', { style: 'margin:0', text: 'Battery use by app' }),
    el('div', { class: 'seg', role: 'group', 'aria-label': 'Period' },
      el('button', { type: 'button', 'data-k': 'b-total', 'aria-pressed': String(battView === 'total'), text: 'Since Quill.OS started', onclick: () => { battView = 'total'; draw(); } }),
      el('button', { type: 'button', 'data-k': 'b-now', 'aria-pressed': String(battView === 'now'), text: 'Right now', onclick: () => { battView = 'now'; draw(); } }))));
  const rows = d.apps.slice().sort((a, b) => battView === 'now' ? b.energyNow - a.energyNow : b.energy - a.energy);
  main.append(appList(rows, battView === 'now' ? 'now' : 'total'));
  main.append(el('p', { class: 'note', text: 'From most to least. Browsers do not reveal the real battery use of each app, so Quill.OS measures the processor time and wake-ups of every app (and any sound it plays) and shares the battery out in that proportion — like the “Energy Impact” of a Mac. Apps outside this browser are not included.' }));
}

function apps(main, d) {
  if (!d.apps) { main.append(message('📋', 'Only inside Quill.OS', 'Install Insider from XApps in Quill.OS to see its apps.')); return; }
  const sel = el('select', { class: 'sel', 'data-k': 'sort', 'aria-label': 'Sort by', onchange: e => { appSort = e.target.value; e.target.blur(); draw(); } });
  sel.addEventListener('blur', () => { if (pending) { pending = false; setTimeout(draw, 0); } });
  for (const [v, l] of [['energy', 'Energy impact'], ['cpu', 'Processor'], ['mem', 'Memory'], ['name', 'Name']]) { const o = el('option', { value: v, text: l }); if (v === appSort) o.selected = true; sel.append(o); }
  main.append(el('div', { class: 'row', style: 'margin-bottom:10px' }, el('h2', { style: 'margin:0', text: (n => n + (n === 1 ? ' app' : ' apps') + ' open')(d.apps.filter(r => r.id !== 'sys' && r.state !== 'closed').length) }), el('label', { class: 'sub' }, 'Sort by ', sel)));
  const key = { energy: r => -r.energyNow, cpu: r => -r.cpuNow, mem: r => -r.mem, name: r => r.name.toLowerCase() }[appSort];
  const rows = d.apps.slice().sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : b.energy - a.energy; });
  const tb = el('tbody');
  for (const r of rows) {
    const [label, cls] = impact(r);
    tb.append(el('tr', {}, el('td', { class: 'n' }, el('span', { style: 'margin-right:8px', text: r.icon || '•' }), r.name),
      el('td', { class: 'hide-s', text: stateText(r) }), el('td', { class: 'r', text: r.state === 'closed' ? '—' : pct(r.cpuNow) }),
      el('td', { class: 'r', text: r.state === 'closed' || r.id === 'sys' ? '—' : fmtBytes(r.mem) }),
      el('td', { class: 'r hide-s', text: fmtWork(r.cpu) }),
      el('td', { class: 'r' }, r.state === 'closed' ? '—' : el('span', { class: 'tag ' + cls, text: label }))));
  }
  main.append(el('div', { class: 'scroll' }, el('table', { class: 'tbl' },
    el('thead', {}, el('tr', {}, el('th', { text: 'App' }), el('th', { class: 'hide-s', text: 'State' }), el('th', { class: 'r', text: 'Processor' }), el('th', { class: 'r', text: 'Memory' }), el('th', { class: 'r hide-s', text: 'Total work' }), el('th', { class: 'r', text: 'Energy' }))), tb)));
  main.append(el('p', { class: 'note', text: 'Processor: the share of one processor core the app used in the last second. Memory: Quill.OS’s estimate for the app. Total work: processor time since Quill.OS started. XApps run sealed, so only their window is measured, not what runs inside them.' }));
}

function device(main, d) {
  const v = d.device || {};
  const add = (group, items) => { main.append(el('h2', { text: group })); const dl = el('dl'); for (const [k, val] of items) if (val != null && val !== '') dl.append(el('dt', { text: k }), el('dd', { text: String(val) })); main.append(dl); };
  add('This device', [['Device', v.kind], ['System', v.os], ['Browser', v.browser], ['Processor cores', v.cores], ['Memory', v.deviceMemory ? 'at least ' + v.deviceMemory + ' GB (the browser rounds it)' : 'not shared by this browser'],
    ['Battery', d.battery && d.battery.supported ? Math.round(d.battery.level * 100) + '% · ' + battLine(d.battery) : 'not shared by this browser'],
    ['Touch screen', v.touch ? 'yes (' + v.touch + ' fingers at once)' : 'no'], ['Language', v.language], ['Time zone', v.timeZone]]);
  add('Screen', [['Size', v.screen ? v.screen.w + ' × ' + v.screen.h + ' points' : ''], ['Pixels', v.screen ? Math.round(v.screen.w * v.screen.dpr) + ' × ' + Math.round(v.screen.h * v.screen.dpr) + ' (×' + v.screen.dpr + ')' : ''],
    ['Window', v.viewport ? v.viewport.w + ' × ' + v.viewport.h : ''], ['Orientation', cap((v.orientation || '').replace('-primary', '').replace('-secondary', ' (upside down)'))], ['Colours', v.screen && v.screen.depth ? v.screen.depth + '-bit' : ''],
    ['Appearance', v.dark ? 'dark' : 'light'], ['Reduce motion', v.reducedMotion ? 'on' : 'off'], ['Frames per second', d.cpu && d.cpu.fps ? d.cpu.fps : '']]);
  const c = v.connection;
  add('Network', [['Connection', v.online ? 'online' : 'offline'], ['Type', c && c.type ? c.type.toUpperCase() : 'not shared by this browser'], ['Speed', c && c.downlink != null ? c.downlink + ' Mbit/s (estimate)' : ''], ['Response time', c && c.rtt != null ? c.rtt + ' ms' : ''], ['Data saver', c ? (c.saveData ? 'on' : 'off') : '']]);
  const q = d.quill, m = d.memory || {}, s = d.storage;
  add('Quill.OS', q ? [['Build', q.build], ['Running for', fmtDur(q.uptime)], ['Windows open', q.windows], ['Chapter', q.chapter], ['Quill’s files', fmtBytes(q.storage.used) + ' of ' + fmtBytes(q.storage.limit)],
    ['Memory', fmtBytes(m.used) + (m.source === 'estimate' ? ' (estimated)' : '')], ['Browser storage', s ? fmtBytes(s.usage) + ' of ' + fmtBytes(s.quota) : ''], ['Delay', d.cpu && d.cpu.lag != null ? d.cpu.lag + ' ms (how late timers run; higher means busier)' : ''],
    ['Installed as an app', v.standalone ? 'yes' : 'no (in a browser tab)'], ['Page visible', v.visible ? 'yes' : 'no']] : [['Running inside Quill.OS', 'no — opened on its own'], ['Browser storage', s ? fmtBytes(s.usage) + ' of ' + fmtBytes(s.quota) : 'not shared']]);
  main.append(el('p', { class: 'note', text: 'Web pages cannot read the processor model, the temperature or other apps on the device; Insider shows everything the browser shares.' }));
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });
draw();
if (inQuill) ask(false); else { ownInit(); refresh(); }
setInterval(() => { if (document.visibilityState === 'visible') tick(); }, 1000);
</script>
</body>
</html>
