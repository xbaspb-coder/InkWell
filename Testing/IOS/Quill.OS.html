<!doctype html>
<html lang="en" data-theme="ink"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quill.OS">
<meta name="theme-color" content="#0a0c13">
<meta name="format-detection" content="telephone=no">
<title>Quill.OS — iOS test</title>
<style>
:root{
  --acc:#e8b04a; --acc-fg:#1a1306; --acc-soft:rgba(232,176,74,.18);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --spine:64px; --ribbon:38px; --r:12px; --fs:14px;
}
:root[data-theme=ink]{--bg0:#0a0c13;--bg1:#11141e;--bg2:#181c29;--bg3:#232837;--fg:#ebe7da;--fg2:#a6a497;--line:rgba(255,255,255,.1);--glass:rgba(17,20,30,.78);--shade:rgba(0,0,0,.55);--paper:#f3ead2;--paper-fg:#2b2418;color-scheme:dark}
:root[data-theme=parchment]{--bg0:#e8dfc6;--bg1:#f4ecd8;--bg2:#fbf6e8;--bg3:#e6dcc0;--fg:#2b2418;--fg2:#6d6247;--line:rgba(60,45,10,.16);--glass:rgba(250,244,228,.8);--shade:rgba(60,45,10,.28);--paper:#fffaf0;--paper-fg:#2b2418;color-scheme:light}
:root[data-theme=aurora]{--bg0:#070f17;--bg1:#0d1b27;--bg2:#13283a;--bg3:#1d3a50;--fg:#e4f4ee;--fg2:#8fb3b0;--line:rgba(160,255,230,.13);--glass:rgba(10,24,36,.78);--shade:rgba(0,0,0,.5);--paper:#e9f6f0;--paper-fg:#10262d;color-scheme:dark}
:root[data-theme=ember]{--bg0:#150a08;--bg1:#201210;--bg2:#2c1a16;--bg3:#3d2620;--fg:#f6e6d8;--fg2:#b99c88;--line:rgba(255,200,160,.13);--glass:rgba(32,18,16,.8);--shade:rgba(0,0,0,.55);--paper:#f7e9d6;--paper-fg:#33201a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--fg);font:var(--fs)/1.4 var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
::selection{background:var(--acc);color:var(--acc-fg)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:6px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
#os{position:fixed;inset:0;overflow:hidden;transition:filter .2s}
body.noanim *,body.noanim *::before,body.noanim *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}

/* ---------- wallpaper ---------- */
#wall{position:absolute;inset:0;overflow:hidden;background:var(--bg0)}
#wall .wl{position:absolute;inset:0}
#wall canvas{position:absolute;inset:0;width:100%;height:100%}
.wp-drift{background:radial-gradient(120% 90% at 20% 10%,#1b2340 0,#0a0c13 60%)}
.wp-drift i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.wp-drift i:nth-child(1){width:46vmax;height:46vmax;left:-8vmax;top:-10vmax;background:#2c3f8f}
.wp-drift i:nth-child(2){width:38vmax;height:38vmax;right:-6vmax;bottom:-12vmax;background:var(--acc);opacity:.32;animation-duration:32s}
.wp-drift i:nth-child(3){width:30vmax;height:30vmax;left:38%;top:30%;background:#6a2c7d;opacity:.4;animation-duration:38s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(8vmax,6vmax) scale(1.18)}}
.wp-aurora{background:linear-gradient(180deg,#050c14,#0b2233 60%,#0f3a3a)}
.wp-aurora i{position:absolute;left:-20%;right:-20%;height:40%;filter:blur(40px);opacity:.55;border-radius:50%;animation:aur 14s ease-in-out infinite alternate}
.wp-aurora i:nth-child(1){top:8%;background:linear-gradient(90deg,transparent,#2de2b0,#3b8cff,transparent)}
.wp-aurora i:nth-child(2){top:26%;background:linear-gradient(90deg,transparent,#8a5cff,#2de2b0,transparent);animation-duration:19s;opacity:.4}
.wp-aurora i:nth-child(3){top:44%;background:linear-gradient(90deg,transparent,#2de2b0,transparent);animation-duration:23s;opacity:.25}
@keyframes aur{from{transform:translateX(-6%) skewX(-8deg)}to{transform:translateX(6%) skewX(8deg)}}
.wp-dunes{background:linear-gradient(180deg,#f4c58a 0,#e9966a 38%,#7b3b4a 70%,#2b1830 100%)}
.wp-dunes i{position:absolute;left:-10%;right:-10%;border-radius:50% 50% 0 0/100% 100% 0 0}
.wp-dunes i:nth-child(1){bottom:-18%;height:46%;background:#5b2a42}
.wp-dunes i:nth-child(2){bottom:-24%;height:40%;background:#3c1d38;left:20%}
.wp-dunes i:nth-child(3){bottom:-30%;height:36%;background:#24122b;right:25%}
.wp-parch{background:#efe5c9}
.wp-parch::before{content:"";position:absolute;inset:0;background:radial-gradient(100% 80% at 50% 30%,rgba(255,255,255,.55),rgba(150,110,40,.22));}
.wp-parch::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .15  0 0 0 .5 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.wp-ember{background:radial-gradient(90% 70% at 50% 110%,#c4421f 0,#4a1810 45%,#150a08 100%)}
.wp-ember i{position:absolute;bottom:-10%;width:3px;height:3px;border-radius:50%;background:#ffb070;box-shadow:0 0 8px #ff8a3c;animation:rise 9s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-90vh) translateX(30px);opacity:0}}
.wp-img{background-size:cover;background-position:center}

/* ---------- ribbon ---------- */
#ribbon{position:absolute;left:0;right:0;top:0;height:var(--ribbon);display:flex;align-items:center;gap:10px;padding:0 10px 0 calc(var(--spine) + 10px);background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line);z-index:5000}
#chapters{display:flex;gap:4px}
.chap{min-width:30px;height:24px;padding:0 8px;border:1px solid var(--line);background:transparent;border-radius:12px;font:italic 600 12px var(--serif);color:var(--fg2);position:relative;transition:background .15s,color .15s,border-color .15s}
.chap:hover{background:var(--bg3);color:var(--fg)}
.chap.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.chap.has::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.chap.on.has::after{background:var(--acc-fg)}
#rtitle{flex:1;text-align:center;font:italic 15px var(--serif);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
#tray{display:flex;align-items:center;gap:2px}
.tbtn{height:28px;min-width:28px;padding:0 8px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--fg);position:relative;font-size:13px;transition:background .15s}
.tbtn:hover,.tbtn.on{background:var(--bg3)}
.tbtn .bdg{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;background:var(--acc);color:var(--acc-fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
#clock{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}

/* ---------- spine (dock) ---------- */
#spine{position:absolute;left:0;top:0;bottom:0;width:var(--spine);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:6px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-right:1px solid var(--line);z-index:5100}
#inkwell-btn{width:46px;height:46px;border-radius:14px;border:none;background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));color:var(--acc-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .15s}
#inkwell-btn:hover{transform:scale(1.07) rotate(-4deg)}
#inkwell-btn svg{width:26px;height:26px}
#dock{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;overflow-x:hidden;width:100%;padding:4px 0;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dk{width:46px;height:46px;flex-shrink:0;border:none;background:transparent;border-radius:13px;position:relative;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,background .15s}
.dk:hover{transform:translateX(3px) scale(1.06);background:var(--bg3)}
.dk.act{background:var(--bg3)}
.dk .run{position:absolute;left:3px;top:50%;width:3px;height:0;background:var(--acc);border-radius:2px;transform:translateY(-50%);transition:height .2s}
.dk.running .run{height:10px}.dk.act .run{height:22px}
.dk .cnt{position:absolute;right:2px;bottom:2px;min-width:14px;height:14px;border-radius:7px;background:var(--acc);color:var(--acc-fg);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sp-bottom{display:flex;flex-direction:column;gap:4px;align-items:center}
.sp-sep{width:30px;height:1px;background:var(--line);margin:2px 0}
.ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 6px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.35);flex-shrink:0}
.ico.sm{width:22px;height:22px;border-radius:7px;font-size:13px}
.ico.lg{width:56px;height:56px;border-radius:16px;font-size:30px}
#tip{position:fixed;z-index:9000;pointer-events:none;background:var(--bg2);color:var(--fg);border:1px solid var(--line);padding:4px 10px;border-radius:8px;font-size:12px;box-shadow:0 6px 20px var(--shade);opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.on{opacity:1}

/* ---------- desktop + windows ---------- */
#desk{position:absolute;left:var(--spine);top:var(--ribbon);right:0;bottom:0;overflow:hidden}
#dicons{position:absolute;inset:8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:88px;gap:2px;align-content:start;justify-content:start}
.di{width:88px;height:92px;border-radius:10px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);overflow:hidden}
:root[data-theme=parchment] .di{color:#2b2418;text-shadow:0 1px 2px rgba(255,255,255,.7)}
.di:hover{background:rgba(255,255,255,.1)}.di.sel{background:var(--acc-soft);border-color:var(--acc)}
.di span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;line-height:1.2}
#wins{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px var(--shade),0 2px 8px rgba(0,0,0,.3);overflow:hidden;animation:winin .22s cubic-bezier(.2,.9,.3,1.05);transition:box-shadow .15s,opacity .15s}
@keyframes winin{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.win:not(.act){box-shadow:0 8px 24px var(--shade)}
.win.act{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.win.min{display:none}
.win.max{border-radius:0}
.win.closing{animation:winout .16s ease-in forwards}
@keyframes winout{to{opacity:0;transform:scale(.94)}}
.wtitle{height:36px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:var(--bg2);border-bottom:1px solid var(--line);cursor:default;touch-action:none}
.win:not(.act) .wtitle{opacity:.78}
.wname{flex:1;min-width:0;font:italic 14px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wctl{display:flex;gap:4px}
.wctl button{width:26px;height:26px;border:none;border-radius:50%;background:transparent;color:var(--fg2);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;transition:background .12s,color .12s}
.wctl button:hover{background:var(--bg3);color:var(--fg)}
.wctl button.x:hover{background:#c0392b;color:#fff}
.wbody{flex:1;min-height:0;position:relative;background:var(--bg1);overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;z-index:3;touch-action:none}
.rz[data-d=n]{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}.rz[data-d=s]{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
.rz[data-d=e]{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}.rz[data-d=w]{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
.rz[data-d=ne]{right:-3px;top:-3px;width:14px;height:14px;cursor:nesw-resize}.rz[data-d=nw]{left:-3px;top:-3px;width:14px;height:14px;cursor:nwse-resize}
.rz[data-d=se]{right:-3px;bottom:-3px;width:14px;height:14px;cursor:nwse-resize}.rz[data-d=sw]{left:-3px;bottom:-3px;width:14px;height:14px;cursor:nesw-resize}
.win.max .rz{display:none}
body.dragging iframe{pointer-events:none}
body.dragging *{cursor:grabbing!important}
#snap{position:absolute;pointer-events:none;border-radius:var(--r);background:var(--acc-soft);border:2px solid var(--acc);transition:all .12s;z-index:4000;opacity:0}
#snap.on{opacity:1}

/* ---------- popovers / menus / modals ---------- */
.pop{position:fixed;z-index:8000;background:var(--glass);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px var(--shade);animation:popin .16s ease-out;color:var(--fg)}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.menu{padding:5px;min-width:190px;max-width:300px;border-radius:11px}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:none;background:transparent;border-radius:7px;text-align:left;font-size:13px;color:var(--fg)}
.mi:hover:not(:disabled){background:var(--acc);color:var(--acc-fg)}
.mi:disabled{opacity:.4;cursor:default}.mi.danger{color:#ff7a6b}.mi.danger:hover{background:#c0392b;color:#fff}
.mi .k{margin-left:auto;font-size:11px;opacity:.6}
.mi .mic{width:18px;text-align:center}
.msep{height:1px;background:var(--line);margin:4px 6px}
#qpanel{top:calc(var(--ribbon) + 6px);right:8px;width:320px;padding:14px}
#npanel{top:calc(var(--ribbon) + 6px);right:8px;width:340px;max-height:70vh;display:flex;flex-direction:column}
.pt{font:italic 600 15px var(--serif);margin:0 0 10px}
.qrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.qrow label{width:22px;text-align:center;font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:var(--bg3);outline:none;min-width:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid var(--bg1);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--bg1);cursor:pointer}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.qt{height:54px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;transition:background .15s}
.qt:hover{background:var(--bg3)}.qt.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}.qt b{font-size:17px;font-weight:400}
.qbtns{display:flex;gap:8px;margin-top:6px}
.qbtns .btn{flex:1}
.btn{height:32px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,transform .1s,border-color .15s}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--bg3) 70%,var(--fg) 12%);border-color:color-mix(in srgb,var(--line) 50%,var(--fg) 30%)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:600}
.btn.pri:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 88%,#fff)}
.btn.dng{background:#a93226;border-color:#a93226;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 10px;font-size:12px;border-radius:7px}
.ibtn{width:30px;height:30px;padding:0;border-radius:8px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--fg)}
.ibtn:hover:not(:disabled){background:var(--bg3)}.ibtn.on{background:var(--acc-soft);color:var(--acc)}.ibtn:disabled{opacity:.35}
.inp{height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg0);color:var(--fg);outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
select.inp{padding-right:6px}
.nrow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);animation:popin .2s ease-out}
.nrow:last-child{border-bottom:none}
.nrow .nt{font-weight:600;font-size:13px}.nrow .nb{font-size:12px;color:var(--fg2);margin-top:1px;word-break:break-word}.nrow .nw{font-size:11px;color:var(--fg2);opacity:.75}
#nlist{overflow-y:auto;flex:1;min-height:60px}
.nhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
#toasts{position:fixed;right:12px;top:calc(var(--ribbon) + 10px);display:flex;flex-direction:column;gap:8px;z-index:9500;width:min(340px,calc(100vw - 24px));pointer-events:none}
.toast{pointer-events:auto;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:10px 12px;display:flex;gap:10px;box-shadow:0 12px 36px var(--shade);animation:toastin .28s cubic-bezier(.2,.9,.3,1.1)}
.toast.out{animation:toastout .22s ease-in forwards}
@keyframes toastin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateX(40px)}}
.toast .nt{font-weight:600;font-size:13px}.toast .nb{font-size:12px;color:var(--fg2)}
#modal{position:fixed;inset:0;z-index:9900;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{width:min(420px,100%);background:var(--bg1);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px var(--shade);padding:18px;animation:popin .2s ease-out}
.dlg h3{margin:0 0 6px;font:italic 600 18px var(--serif)}
.dlg p{margin:0 0 12px;color:var(--fg2);font-size:13px;white-space:pre-wrap;word-break:break-word}
.dlg .inp{width:100%;height:36px;margin-bottom:12px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}

/* ---------- inkwell (launcher) ---------- */
#ink{position:fixed;inset:0;z-index:8800;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fade .15s}
#inkbox{width:min(640px,calc(100vw - 20px));max-height:72vh;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;padding:0}
#inkq{height:56px;border:none;border-bottom:1px solid var(--line);background:transparent;padding:0 20px;font:italic 20px var(--serif);outline:none;color:var(--fg);width:100%;user-select:text}
#inkq::placeholder{color:var(--fg2)}
#inklist{overflow-y:auto;padding:8px;flex:1}

const GUIDE_MD = `# Quill.OS Guide

An operating system made of ink and glass, running inside OG Browser. This guide covers everything.

## The desktop
- **The Spine** (left bar): your apps. Click to open, click again to minimise. Right-click for more, or to pin and unpin.
- **The Inkwell** (the quill at the top of the Spine, or **Ctrl+K**): type to launch apps, find files, run quick sums (\`= 12*(3+4)\`), search OG, or run a terminal command with \`>\`.
- **Chapters**: the I II III IV buttons in the ribbon are four separate desktops. **Alt+1** to **Alt+4** switch. Right-click a title bar to send a window to another chapter.
- **Spread** (**Alt+S**): a card for every window.
- **Margin notes**: right-click the desktop to pin a sticky note. They are saved for you.
- **Snapping**: drag a window to the left or right edge to fill half the screen, or to the top to maximise.

## The apps
| App | What it does |
| --- | --- |
| **Atlas** | Files and folders. Drag and drop, copy, cut, paste, rename, Trash, upload, export |
| **Scribe** | Notes with Markdown and a live preview |
| **Glyph** | Code editor with highlighting, find and replace, and **Run** for JavaScript, HTML and JSON |
| **OG Browser** | The whole browser in a window (device build); otherwise opens a browser tab |
| **Quill Shell** | A command line with pipes, redirects and over 70 commands |
| **Abacus** | Calculator with a scientific mode and history |
| **Brush** | Paint with pencil, brush, spray, shapes, fill and undo |
| **Chrono** | Clock, stopwatch, timers and alarms that ring even when the window is closed |
| **Lyre** | Piano, a beat maker and a music player for your own files |
| **Lens** | Image viewer: zoom, rotate, wallpaper |
| **Almanac** | Calendar with events and reminders |
| **Arcade** | Snake, 2048 and Minesweeper |
| **Pulse** | Task manager, performance graphs and services |
| **Portal** | Jump to Galau Mail, Ferret, LifeCraft, LifeGames and the other OG sites |
| **Compass** | A small web view |
| **XApps** | The app store: install apps people made, or publish your own HTML app |
| **Loom** | Settings: themes, wallpapers, your Galau account, your password, storage |

## Your files
Everything lives in a private file system on this device: Desktop, Documents, Pictures, Music, Downloads and Projects. Files you delete go to the **Trash** first. Each file can be up to 1.5 MB, and all of Quill together holds about 4 MB.

Sign in with Galau services and switch on **cloud sync** in Loom to keep a copy in your account (up to about 2.8 MB).

## The shell, in a nutshell
\`\`\`
ls -l            list files
cd Documents     change folder
echo hi > a.txt  write a file
cat a.txt | grep -i hi
run hello.js     run JavaScript
open calc        open an app
theme aurora     change the look
neofetch         system summary
help             every command
\`\`\`

## Tips
- Press **Ctrl+S** in any editor to save.
- In Glyph, **Ctrl+Enter** runs the file, **Ctrl+/** comments lines and **Ctrl+F** finds text.
- Drop files from your computer onto the desktop or an Atlas window to add them.
- Your **password** (chosen when Quill first starts, changed in Loom → Security) unlocks the screen. Press **Alt+L** to lock.
`;

(function () {

/* ---- Quill's password: a salted, slow hash (PBKDF2-SHA256), the same format as the Python version ---- */
const PW_ROUNDS = 60000;
const toHex = b => Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('');
async function pbkdf2(pw, salt, rounds) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: rounds }, key, 256));
}
async function hashPassword(pw) {
  if (!(window.crypto && crypto.subtle)) return hashPin(pw);   // pages served over plain http have no Web Crypto
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return 'pbkdf2$' + PW_ROUNDS + '$' + toHex(salt) + '$' + toHex(await pbkdf2(pw, salt, PW_ROUNDS));
}
async function checkPassword(pw, stored) {
  if (!stored) return false;
  if (stored.startsWith('pbkdf2$')) {
    const p = stored.split('$');
    if (p.length !== 4 || !(window.crypto && crypto.subtle)) return false;
    const salt = new Uint8Array((p[2].match(/../g) || []).map(x => parseInt(x, 16)));
    const got = toHex(await pbkdf2(pw, salt, +p[1]));
    let diff = got.length ^ p[3].length;
    for (let i = 0; i < Math.min(got.length, p[3].length); i++) diff |= got.charCodeAt(i) ^ p[3].charCodeAt(i);
    return diff === 0;
  }
  return (await hashPin(pw)) === stored;     // a PIN from an older version
}

  async install(row) {

  async uninstall(id) {

  async publish(f) {

APPS.xapps = {
  name: 'XApps', icon: 'X', bg: 'linear-gradient(145deg,#ff6a3d,#c2185b)', w: 780, h: 560, single: true, kw: 'xapps app store apps download install publish market shop', about: 'The app store',

/* ===================== Start-up ===================== */
let NOSAVE = false;
window.QOS = { Galau, XA, checkPassword, get S() { return S; }, set S(v) { S = v; }, WM, FS, APPS, Dlg, Ink, Lock, Spread, Panels, Menu, Bridge, Bus, notify, toast, calcEval, md, SH, Power, Open, runJS, highlight, normalizeState, get ME() { return ME; }, reloadUI, setupWizard };
async function main() {
  Boot.show();
  const t0 = performance.now();
  try { ME = Bridge.hosted ? await Bridge.call('me') : null; } catch (e) { ME = null; }

  let raw = null, loadErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      let j = null;
      if (Bridge.hosted) j = await Bridge.call('state.get'); else { try { j = window.localStorage.getItem('qos-standalone'); } catch (e) { j = window.__qosMem || null; } }

  registerXApps();
  setCloud(ME && S.set.autosync ? 'idle' : 'off');
  applyLook(); renderChapters(); renderDock(); renderDesktop(); renderNotes(); updateBell(); updateClock();
  if (ME && S.set.autosync && !NOSAVE) { try { const r = await Promise.race([cloudPull(), sleep(5000).then(() => 'late')]); if (r === 'pulled') { S.meta.boots++; applyLook(); renderDock(); renderDesktop(); renderNotes(); updateBell(); } } catch (e) { /* offline: keep local copy */ } }

}
main().catch(e => { console.error(e); const d = h('div', { class: 'full', style: { zIndex: 99999 } }, h('div', { class: 'bname', text: 'Quill.OS could not start' }), h('div', { class: 'bsub', text: String(e && e.message || e) }), h('button', { class: 'btn pri', text: 'Try again', onclick: () => location.reload() })); document.body.append(d); });
